<!doctype html>
<html>
  <head>
    <title>Student Records</title>
    <style>
  :root {
    --ink: #24312f;
    --muted: #66736f;
    --line: #dce4e0;
    --paper: #ffffff;
    --background: #f3f6f4;
    --accent: #176b5b;
    --accent-hover: #115447;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--background);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .site-header {
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }

  .header-inner, main {
    width: min(960px, calc(100% - 36px));
    margin: 0 auto;
  }

  .header-inner {
    min-height: 64px;
    display: flex;
    align-items: center;
  }

  .brand {
    color: var(--ink);
    font-weight: 650;
    text-decoration: none;
  }

  main { padding: 40px 0 64px; }

  .eyebrow {
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 650;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  h1 { margin: 4px 0 8px; font-size: clamp(1.8rem, 4vw, 2.4rem); }
  h2 { margin-top: 0; font-size: 1.15rem; }
  .intro, .muted { color: var(--muted); }

  .panel, .table-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  .panel { margin-top: 28px; padding: 24px; }

  .table-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 14px;
    margin-top: 18px;
  }

  .table-card { padding: 18px; }
  .table-card h3 { margin: 0 0 14px; }

  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }

  a { color: var(--accent); }
  a:hover { color: var(--accent-hover); }

  .button, button {
    display: inline-block;
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 8px 13px;
    background: var(--accent);
    color: white;
    font: inherit;
    font-size: 0.92rem;
    text-decoration: none;
    cursor: pointer;
  }

  .button:hover, button:hover {
    background: var(--accent-hover);
    color: white;
  }

  .button.secondary {
    background: white;
    color: var(--accent);
  }

  .back-link { display: inline-block; margin-bottom: 20px; }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }

  label { display: block; margin-bottom: 6px; font-weight: 550; }

  input {
    width: 100%;
    padding: 10px 11px;
    border: 1px solid #bdc9c3;
    border-radius: 6px;
    background: white;
    color: var(--ink);
    font: inherit;
  }

  input:focus {
    outline: 3px solid #176b5b30;
    border-color: var(--accent);
  }

  .alert {
    margin: 16px 0;
    padding: 12px 14px;
    border: 1px solid #e6c7a4;
    border-radius: 6px;
    background: #fff8ee;
  }

  .table-scroll { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
  }

  th, td {
    padding: 11px 13px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    white-space: nowrap;
  }

  th {
    background: #f7f9f8;
    color: #475550;
    font-size: 0.85rem;
    font-weight: 650;
  }

  tr:last-child td { border-bottom: 0; }

  @media (max-width: 600px) {
    main { padding-top: 28px; }
    .panel { padding: 18px; }
  }
</style>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ url_for('index') }}">Student Records</a>
      </div>
    </header>

    <main>
      <p class="eyebrow">Database</p>
      <h1>Records</h1>
      <p class="intro">Browse a table to see its current records or add a new one.</p>

      {% if tables %}
        <section class="table-list">
          {% for table in tables %}
            <article class="table-card">
              <h3>{{ table|replace('_', ' ')|title }}</h3>
              <div class="actions">
                <a class="button" href="{{ url_for('show_table', table_name=table) }}">Show all</a>
                <a href="{{ url_for('show_table', table_name=table) }}#add-record">Add a record</a>
              </div>
            </article>
          {% endfor %}
        </section>
      {% else %}
        <section class="panel">
          <p>No tables found in this database.</p>
        </section>
      {% endif %}
    </main>
  </body>
</html>
